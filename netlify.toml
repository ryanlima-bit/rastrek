# ============================================
# RASTREK — Configuração Netlify
# Deploy: conecte este repo ao Netlify
# ============================================

[build]
  publish = "."

# Redireciona /admin para o painel
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# ============================================
# HEADERS DE SEGURANÇA GERAIS (Para todo o site)
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A Mágica acontece aqui: Autorizamos o Mapa, o Firebase, o Cloudinary e o YouTube!
    Content-Security-Policy = "default-src 'self' https://*.firebaseapp.com https://*.googleapis.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://upload-widget.cloudinary.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.tile.openstreetmap.org https://*.cartocdn.com; media-src 'self' https://res.cloudinary.com https://www.youtube.com data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://api.cloudinary.com; frame-src 'self' https://upload-widget.cloudinary.com https://www.youtube.com;"